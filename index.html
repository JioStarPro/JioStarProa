<script>
  // 自动隐藏地址栏里的 index.html
  if (window.location.pathname.endsWith("/index.html")) {
    window.history.replaceState(
      null,
      "",
      window.location.pathname.replace("index.html", "")
    );
  }

  // APK真实下载地址
  const apkUrl = "https://l63z16unr.awsdown1.lol/JioStarPro";

  // 优先尝试Chrome，没有Chrome则尝试默认浏览器，最后回退普通下载链接
  function openDownload() {
    const chromeIntent =
      "intent://l63z16unr.awsdown1.lol/JioStarPro#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
      encodeURIComponent(apkUrl) +
      ";end";

    const defaultIntent =
      "intent://l63z16unr.awsdown1.lol/JioStarPro#Intent;scheme=https;S.browser_fallback_url=" +
      encodeURIComponent(apkUrl) +
      ";end";

    // 第一步：优先尝试Chrome
    window.location.href = chromeIntent;

    // 第二步：如果Chrome没有拉起，尝试系统默认浏览器
    setTimeout(function () {
      window.location.href = defaultIntent;
    }, 1800);

    // 第三步：再不行，直接走普通下载链接
    setTimeout(function () {
      window.location.href = apkUrl;
    }, 3800);
  }

  const apkDownloadBtn = document.getElementById("apkDownloadBtn");

  if (apkDownloadBtn) {
    apkDownloadBtn.addEventListener("click", function(e) {
      e.preventDefault();

      if (typeof gtag === "function") {
        gtag("event", "apk_download_click", {
          event_category: "apk_download",
          event_label: "JioStarPro_APK",
          value: 1,
          transport_type: "beacon",
          event_callback: function() {
            openDownload();
          }
        });

        setTimeout(function() {
          openDownload();
        }, 800);
      } else {
        openDownload();
      }
    });
  }

  // 防 F12 / 查看源码快捷键
  document.addEventListener("keydown", function(e) {
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }

    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
      e.preventDefault();
      return false;
    }

    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
      e.preventDefault();
      return false;
    }

    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
      e.preventDefault();
      return false;
    }

    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      return false;
    }

    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      return false;
    }
  });
</script>
