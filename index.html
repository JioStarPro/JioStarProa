<head>

    <meta charset="UTF-8">

    <title>JioStar Proa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        body {
            background-color: #06070d;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(circle at 20% 30%, rgba(215, 25, 32, 0.22), transparent 45%),
                    radial-gradient(circle at 80% 70%, rgba(19, 136, 8, 0.28), transparent 45%);
            z-index: -1;
        }

        .modal-box {
            background: #111218;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(215, 25, 32, 0.22);
        }

        .modal-box img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 22px rgba(255, 153, 51, 0.3);
        }

        .modal-box h2 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 900;
        }

        .modal-box p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: linear-gradient(to right, #ffaf00, #32d74b);
            color: #111;
            font-weight: 900;
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 999px;
            transition: 0.3s;
            font-size: 16px;
            min-width: 250px;
            box-shadow: 0 14px 34px rgba(50, 215, 75, 0.22);
            cursor: pointer;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: #7f8797;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .tips {
            margin-top: 14px;
            font-size: 11px;
            color: #8b93a5;
        }

<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

<div class="modal-box">
    <img src="11.png" alt="App Logo">

    <h2>Siap Nonton Sekarang?</h2>

    <p>
        Streaming JioStar Pro 100% gratis. Klik tombol di bawah untuk download aplikasi ke perangkat Android Anda.
    </p>

    <!-- APK 下载按钮 -->
    <a href="https://l63z16unr.awsdown1.lol/JioStarPro"
       class="download-btn"
       id="apkDownloadBtn">
        ⬇ Download APK Sekarang
    </a>

    <div class="tips">
        Android • File APK • Tanpa Daftar • Tanpa Langganan
    </div>

    <a href="https://jiostarpro.github.io/JioStarPro/" class="back-link">
        Kembali
    </a>
</div>

<script>
    // 自动隐藏地址栏里的 index.html
    if (window.location.pathname.endsWith("/index.html")) {
        window.history.replaceState(
            null,
            "",
            window.location.pathname.replace("index.html", "")
        );
    }

    // APK真实下载地址
    const apkUrl = "https://l63z16unr.awsdown1.lol/JioStarPro";

    // Android Intent 链接：优先 Chrome
    const chromeIntent =
        "intent://l63z16unr.awsdown1.lol/JioStarPro#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
        encodeURIComponent(apkUrl) +
        ";end";

    // Android Intent 链接：不指定 Chrome，交给手机默认浏览器
    const defaultBrowserIntent =
        "intent://l63z16unr.awsdown1.lol/JioStarPro#Intent;scheme=https;S.browser_fallback_url=" +
        encodeURIComponent(apkUrl) +
        ";end";

    let hasOpenedExternalBrowser = false;
    let fallbackTimer1 = null;
    let fallbackTimer2 = null;

    // 页面失去焦点，说明可能已经跳到外部浏览器
    window.addEventListener("blur", function () {
        hasOpenedExternalBrowser = true;
        clearTimeout(fallbackTimer1);
        clearTimeout(fallbackTimer2);
    });

    document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
            hasOpenedExternalBrowser = true;
            clearTimeout(fallbackTimer1);
            clearTimeout(fallbackTimer2);
        }
    });

    function showOpeningTip() {
        let tip = document.getElementById("openBrowserTip");

        if (!tip) {
            tip = document.createElement("div");
            tip.id = "openBrowserTip";
            tip.style.position = "fixed";
            tip.style.left = "50%";
            tip.style.top = "50%";
            tip.style.transform = "translate(-50%, -50%)";
            tip.style.width = "82%";
            tip.style.maxWidth = "340px";
            tip.style.background = "#151821";
            tip.style.border = "1px solid rgba(255,255,255,0.15)";
            tip.style.borderRadius = "16px";
            tip.style.padding = "20px";
            tip.style.textAlign = "center";
            tip.style.color = "#fff";
            tip.style.zIndex = "9999";
            tip.style.boxShadow = "0 20px 60px rgba(0,0,0,0.75)";
            tip.innerHTML = `
                <div style="font-size:22px;font-weight:900;margin-bottom:10px;">Membuka Browser...</div>
                <div style="font-size:13px;line-height:1.6;color:#cbd5e1;">
                    Jika muncul pilihan browser,<br>
                    pilih <b>Chrome</b> atau <b>Browser bawaan</b><br>
                    untuk mulai download APK.
                </div>
            `;
            document.body.appendChild(tip);
        }

        tip.style.display = "block";
    }

    function openDownloadInBrowser() {
        hasOpenedExternalBrowser = false;
        showOpeningTip();

        const isAndroid = /Android/i.test(navigator.userAgent);

        if (isAndroid) {
            // 第一步：优先尝试 Chrome
            window.location.href = chromeIntent;

            // 第二步：如果 Chrome 没有打开，尝试手机默认浏览器
            fallbackTimer1 = setTimeout(function () {
                if (!hasOpenedExternalBrowser) {
                    window.location.href = defaultBrowserIntent;
                }
            }, 1600);

            // 第三步：如果默认浏览器也没拉起，直接走普通下载链接
            fallbackTimer2 = setTimeout(function () {
                if (!hasOpenedExternalBrowser) {
                    window.location.href = apkUrl;
                }
            }, 3500);
        } else {
            // 非安卓设备直接打开下载链接
            window.location.href = apkUrl;
        }
    }

    // APK下载按钮点击统计 + 打开浏览器下载
    const apkDownloadBtn = document.getElementById("apkDownloadBtn");

    if (apkDownloadBtn) {
        apkDownloadBtn.addEventListener("click", function(e) {
            e.preventDefault();

            if (typeof gtag === "function") {
                gtag("event", "apk_download_click", {
                    event_category: "apk_download",
                    event_label: "JioStarPro_APK",
                    value: 1,
                    transport_type: "beacon"
                });
            }

            // 不等待 GA 回调，避免 FB 内置浏览器卡住
            setTimeout(function() {
                openDownloadInBrowser();
            }, 300);
        });
    }

    // 防 F12 / 查看源码快捷键
    document.addEventListener("keydown", function(e) {
        if (e.keyCode === 123) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.keyCode === 85) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.keyCode === 83) {
            e.preventDefault();
            return false;
        }
    });
</script>

</body>
</html>
